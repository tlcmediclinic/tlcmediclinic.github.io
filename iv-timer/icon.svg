<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TLC 수액 타이머 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF9FF"/>
      <stop offset="0.48" stop-color="#CFEEFC"/>
      <stop offset="1" stop-color="#E9FBF5"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#C9F0FF"/>
      <stop offset="0.45" stop-color="#79CBF3"/>
      <stop offset="1" stop-color="#2196D3"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD2F2"/>
      <stop offset="1" stop-color="#2E8FC8"/>
    </linearGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7F2DF"/>
      <stop offset="1" stop-color="#49C6A9"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.35" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2C7FA8" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="118" cy="96" r="150" fill="#FFFFFF" opacity="0.42"/>
  <circle cx="430" cy="438" r="170" fill="#B9F0E2" opacity="0.30"/>

  <!-- 스톱워치 고리 -->
  <g filter="url(#sh)" transform="translate(268 262)">
    <circle r="150" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.95"/>
    <circle r="150" fill="none" stroke="#FFFFFF" stroke-width="38" opacity="0.16"/>
    <g stroke="#3D9FD0" stroke-width="12" stroke-linecap="round" opacity="0.75">
      <line x1="0" y1="-124" x2="0" y2="-104"/>
      <line x1="88" y1="-88" x2="74" y2="-74"/>
      <line x1="124" y1="0" x2="104" y2="0"/>
      <line x1="88" y1="88" x2="74" y2="74"/>
      <line x1="-88" y1="-88" x2="-74" y2="-74" opacity="0.35"/>
      <line x1="-124" y1="0" x2="-104" y2="0" opacity="0.35"/>
    </g>
    <rect x="-26" y="-192" width="52" height="30" rx="12" fill="url(#ring)"/>
    <rect x="96" y="-140" width="46" height="24" rx="11" fill="url(#ring)" transform="rotate(38 96 -140)"/>
  </g>

  <!-- 수액 방울 -->
  <g filter="url(#sh)">
    <path d="M196 96c0 0 96 112 96 168 0 55-43 96-96 96s-96-41-96-96c0-56 96-168 96-168z" fill="url(#drop)"/>
    <path d="M196 96c0 0 96 112 96 168 0 55-43 96-96 96s-96-41-96-96c0-56 96-168 96-168z" fill="url(#gloss)"/>
    <ellipse cx="163" cy="268" rx="20" ry="30" fill="#ffffff" opacity="0.55" transform="rotate(-18 163 268)"/>
    <path d="M118 300c12 34 42 56 78 56" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 민트 + 배지 -->
  <g filter="url(#sh)">
    <rect x="296" y="342" width="132" height="132" rx="40" fill="url(#plus)"/>
    <rect x="296" y="342" width="132" height="132" rx="40" fill="url(#gloss)" opacity="0.55"/>
    <path d="M362 372v72M326 408h72" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
